[package]
name = "ctx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7.0.0"
dotenvy = "0.15.7"
embed = { version = "0.1.0", path = "../embed" }
indexmap = { version = "2.14.2", features = ["serde"] }
ingest = { version = "0.1.0", path = "../ingest" }
jiff = "0.2.37"
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sources = { version = "0.1.0", path = "../sources" }
store = { version = "0.1.0", path = "../store" }
tokio = { version = "1", features = ["full"] }
ureq = { version = "3", features = ["json"] }
uuid = "1"

[dev-dependencies]
ingest = { path = "../ingest" }
rmcp = { version = "3.4", features = ["client", "transport-async-rw"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3.27.0"
testkit = { path = "../testkit" }
tokio = { version = "1", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[features]
directml = ["embed/directml"]
