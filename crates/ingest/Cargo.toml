[package]
name = "ingest"
version = "0.1.0"
edition = "2024"

[dependencies]
embed = { version = "0.1.0", path = "../embed", default-features = false }
jiff = "0.2.37"
regex = "1.13.1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1.0.151"
sources = { version = "0.1.0", path = "../sources" }
store = { version = "0.1.0", path = "../store" }
thiserror = "2.0.21"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
uuid = "1"

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
testkit = { path = "../testkit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
