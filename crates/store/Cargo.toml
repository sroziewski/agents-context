[package]
name = "store"
version = "0.1.0"
edition = "2024"

[dependencies]
embed = { path = "../embed", default-features = false }
qdrant-client = { version = "1.19.0", default-features = false, features = ["serde"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uuid = { version = "1", features = ["v5"] }

[dev-dependencies]
anyhow = "1.0.104"
testkit = { path = "../testkit" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
